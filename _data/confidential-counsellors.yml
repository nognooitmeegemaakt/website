- name: Ari
  photo: assets/img/confidential-counsellors/ari.jpeg
  phone: "0630044358"
  email: ari@nognooitmeegemaakt.nl
  bio: |
    Hoi! Ik ben Ari en binnen de scouting Petrus en Paulus de aangewezen vertrouwenspersoon. Je kan mij bereiken wanneer er een probleem is waar je met iemand over wilt praten zonder dat daar directe gevolgen aan zitten. Bij mij vertel je namelijk alles in vertrouwen. Natuurlijk zitten hier ook grenzen aan, maar dat bespreken we wanneer je bij me zou komen.

    Als jeugdlid ga je met een probleem of opmerking in eerste instantie naar je eigen staflid, mocht dit om welke reden dan ook niet mogelijk zijn of vertrouwd voelen, kun je naar mij toe komen.
    Ook voor ouders, verzorgers of betrokkene kun je mij benaderen wanneer er iets speelt. Ik zal je verhaal aanhoren en daarna kunnen we eventueel bespreken wat onze opties zijn.

    We doen het samen.

    In de regel heeft iedere scouting groep minimaal 1 vertrouwenspersoon.

    Naast mijn functie als vertrouwenspersoon heb ik ook een rol binnen de speltak van de scouts. Ik ben dus vrijwel iedere dinsdagavond en zaterdagmiddag aanwezig op het troeplokaal. Vanaf 2007 ben ik lid van de groep, en altijd nauw betrokken geweest.

    Naast deze fantastische scouting vereniging ben ik sinds 2019 verpleegkundige en sinds kort ook werkzaam in het diakonessenhuis. Utrecht is ook de plek waar ik op dit moment woonachtig ben.
    Het grootste gedeelte van mijn leven heb ik in Den Bosch gewoond, wat dus ook altijd mijn thuishaven zal blijven.

- name: Rowan van Drunen
  photo: # assets/img/confidential-counsellors/rowan.jpg
  phone: # nog op te vragen
  email: # nog op te vragen
  bio: |
    Hoi ik ben Rowan van Drunen, maar de meeste binnen de troep zullen mij kennen als Tabaqui. Ik ben ruim 20 jaar betrokken bij de P&P allereerst als welpenstaflid en daarna nog jaren als kookstaf. Mijn verbondenheid met de troep is daardoor erg groot. In het dagelijks leven werk ik in de zorg. Ik werk als ambulant begeleider in de WMO zorg. Vanuit die rol ben ik betrokken bij de proeftuin in Tilburg waarin ik samen met meerdere disciplines meekijk om veiligheid terug te krijgen in probleemgezinnen.
    Door al deze jarenlange ervaring kijk ik er naar uit om als vertrouwenspersoon aan de slag te gaan.
